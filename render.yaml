# HoneyDesk — Render Blueprint (API + frontend) — FREE tier
# Create via Render Dashboard → New → Blueprint → this repo.
# No payment / card required. Tradeoffs:
#   - SQLite is ephemeral (wiped on restart, redeploy, or idle spin-down)
#   - Free services sleep after ~15 min idle; first hit can take ~30–60s
# Demo tip: open both URLs once before recording so they are warm.
#
# Default public hostnames (used for CORS / API URL wiring):
#   https://honeydesk-api.onrender.com
#   https://honeydesk-web.onrender.com
# If you rename a service, update CORS_ORIGINS and NEXT_PUBLIC_API_URL to match.

services:
  - type: web
    name: honeydesk-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      # Ephemeral path inside the container (no persistent disk on free).
      - key: DATABASE_URL
        value: sqlite:////app/data/honeydesk.db
      # Exact frontend origin(s), comma-separated, no trailing slash.
      - key: CORS_ORIGINS
        value: https://honeydesk-web.onrender.com,http://localhost:3000,http://127.0.0.1:3000
      - key: SIMULATE_TOKEN
        generateValue: true
      - key: REQUIRE_SIMULATE_TOKEN
        value: "true"
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: BRIEF_FAILOVER_CACHE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"

  - type: web
    name: honeydesk-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://honeydesk-api.onrender.com
      - key: NEXT_PUBLIC_SIMULATE_TOKEN
        fromService:
          name: honeydesk-api
          type: web
          envVarKey: SIMULATE_TOKEN
